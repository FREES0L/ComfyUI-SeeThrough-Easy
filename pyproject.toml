[project]
name = "comfyui-seethrough-easy"
description = "See-through anime layer decomposition for ComfyUI, with automatic model download, low-VRAM defaults, a clean layer export and a one-click Windows installer."
version = "1.0.0"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "diffusers>=0.37.0",
    "peft>=0.18.0",
    "accelerate>=0.20.0",
    "huggingface_hub>=0.23.0",
    "opencv-python>=4.0.0",
    "scikit-learn>=1.0.0",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/FREES0L/ComfyUI-SeeThrough-Easy"
Upstream = "https://github.com/jtydhr88/ComfyUI-See-through"

[tool.comfy]
PublisherId = "freesol"
DisplayName = "ComfyUI-SeeThrough-Easy"
Icon = ""
